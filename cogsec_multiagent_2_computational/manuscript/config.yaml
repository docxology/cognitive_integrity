    v2.0 (2026-07-05): Second Edition — adversarial training, red-teaming,
    expanded colony simulations (100-500 agents), Fisher information metric
    derivations in S10, property-based tests with Hypothesis, stress tests,
    extended formal verification (TLA+/Promela/SMV), Ω_1–Ω_5 attack taxonomy,
    new manuscript sections (05g_adversarial_training, 05h_redteam_evaluation),
    new supplement S11 (adversarial training theory), updated references.
    New in this revision: §8 category-theoretic foundations (defense lattice,
    symmetric monoidal category, operad, enriched category, pipeline monad, Kan
    extensions, lens/optic profunctor), figure/table auto-numbering registry
    (scripts/generate_figure_registry.py, src/manuscript/figure_registry.py),
    auto_number_figures.py script, S12 composable visualization supplement,
    preamble updated with tikz-cd/stmaryrd/tocloft + listoffigures/listoftables,
    config.yaml extended with category theory / visualization keywords.

