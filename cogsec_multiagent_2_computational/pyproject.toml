# CogSec Multiagent Computational Validation - Project Configuration
# Part 2 of Cognitive Security for Multiagent Operators series

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]

name = "cogsec-multiagent-computational"
version = "2.0.0"
description = "Cognitive Integrity Framework: Computational Validation and Empirical Analysis"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "requests>=2.33.1",
    "hypothesis>=6.156.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-httpserver>=1.1.5",
    "pytest-timeout>=2.3.0",
    "mypy>=1.11.0",
    "ruff>=0.4.0",
    "hypothesis>=6.0.0",
]

# Packaging layout.
#
# `where = ["src"]` published every directory under src/ as its own TOP-LEVEL
# import name: ablation, agents, analysis, architectures, attacks, colony,
# composition, core, data, evaluation, formal, manuscript, redteam, statistics,
# utils, visualization.  Installing this distribution therefore squatted 16
# generic names in the consumer's environment, and `statistics` shadowed the
# standard-library module for anything that put src/ on sys.path (which this
# repo's own pytest config does via `pythonpath = ["src"]`).
#
# Publishing the single `src` package instead keeps every in-repo consumer
# working -- tests and scripts resolve modules by putting src/ on sys.path
# themselves, never through the installed distribution -- while `import src`
# still runs the sys.path shim in src/__init__.py, so the historical
# `from core.trust import ...` style keeps working after `import src`.
[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
# Per-test wall-clock ceiling so a hung test cannot burn a full CI job.  The
# slowest test in the suite is ~2.4s, so 120s is ~50x headroom for a slow
# runner.  Honoured by pytest-timeout (dev group); ignored with a warning if
# the plugin is not installed.
timeout = 120
markers = [
    "requires_ollama: tests requiring a running Ollama server with local LLM models",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "except (ImportError, ModuleNotFoundError):",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# These files manipulate sys.path before importing project modules — E402 is intentional.
"src/__init__.py" = ["E402"]
"src/statistics/__init__.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"tests/test_agents.py" = ["E402"]
"tests/test_bayesian.py" = ["E402"]
"tests/test_category_theory.py" = ["E402"]
"tests/test_free_energy.py" = ["E402"]
"tests/test_game_theory.py" = ["E402"]
"tests/test_information_geometry.py" = ["E402"]
"tests/test_monad.py" = ["E402"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
exclude = ["src/__main__.py"]
# Bodies of un-annotated functions are checked too.  Without this, mypy reports
# "Success" while skipping every function that lacks a signature annotation --
# which is how a dead import and two type errors survived a "clean" mypy run.
check_untyped_defs = true

[tool.uv]
package = true

[project.urls]
Repository = "https://github.com/docxology/cognitive_integrity"
