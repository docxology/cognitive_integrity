# CogSec Multiagent Computational Validation - Project Configuration
# Part 2 of Cognitive Security for Multiagent Operators series

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogsec-multiagent-computational"
version = "2.0.0"
description = "Cognitive Integrity Framework: Computational Validation and Empirical Analysis (Second Edition)"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "requests>=2.33.1",
    "hypothesis>=6.156.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-httpserver>=1.1.5",
    "ruff>=0.4.0",
    "hypothesis>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "requires_ollama: tests requiring a running Ollama server with local LLM models",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "except (ImportError, ModuleNotFoundError):",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# These files manipulate sys.path before importing project modules — E402 is intentional.
"src/__init__.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"tests/test_agents.py" = ["E402"]
"tests/test_bayesian.py" = ["E402"]
"tests/test_category_theory.py" = ["E402"]
"tests/test_free_energy.py" = ["E402"]
"tests/test_game_theory.py" = ["E402"]
"tests/test_information_geometry.py" = ["E402"]
"tests/test_monad.py" = ["E402"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
exclude = ["src/__main__.py"]

[tool.uv]
package = true
