# CogSec Multiagent Theory - Project Configuration
# Part 1 of Cognitive Security for Multiagent Operators series

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]

name = "cogsec-multiagent-theory"
version = "1.1.0"
description = "Formal Foundations of the Cognitive Integrity Framework (Second Edition)"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__init__.py", "*/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/conftest.py" = ["E402"]
"src/data_generation.py" = ["E402"]
"src/visualization/*" = ["E402"]
"src/verification.py" = ["E402"]
"src/__init__.py" = ["E402"]
"src/consensus.py" = ["E402"]
"src/detection.py" = ["E402"]
"src/firewall.py" = ["E402"]
"src/invariants.py" = ["E402"]
"src/sandbox.py" = ["E402"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Inherits workspace settings from root pyproject.toml

[project.urls]
Repository = "https://github.com/docxology/cognitive_integrity"
