# CogSec Multiagent Practical+Applications — unified Part 3+4

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]

name = "cogsec-multiagent-practical"
version = "2.0.0"
description = "CIF Practical Applications and Deployment Guide — unified Parts 3 and 4: practitioner guidance and cross-domain CIF-AD-OODA analysis"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.10"

dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__init__.py", "*/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/conftest.py" = ["E402"]
"src/posture.py" = ["E501"]
"src/agent_guidelines.py" = ["E501"]
"src/risk_assessment.py" = ["E501"]
"src/identity.py" = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Inherits workspace settings from root pyproject.toml

[project.urls]
Repository = "https://github.com/docxology/cognitive_integrity"
